name: Offline Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OTEL_SDK_DISABLED: "true"
      CREWAI_TELEMETRY_DISABLED: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./crew[test]" build
      - run: python -m pytest crew/tests -q
      - run: python -m build crew
      - name: Verify the installed wheel includes crew configuration
        run: |
          python -m pip install --force-reinstall --no-deps crew/dist/*.whl
          cd "$(mktemp -d)"
          python -c 'from src.crew import load_yaml; assert "triager" in load_yaml("agents.yaml")'
